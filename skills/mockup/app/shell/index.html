<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mockup</title>
<link rel="stylesheet" href="/shell/shell.css">
<script type="module" src="/shell/shell.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">mockup</span>
  <span class="design" id="session-name"></span>
  <span class="dot" id="dot"></span>
  <span class="presence" id="presence">Connecting</span>
</header>
<div id="banner"></div>
<main class="body">
  <section class="canvas" id="canvas">
    <div class="bar" id="bar"><span class="path" id="path"></span></div>
    <div class="stage" id="stage"></div>
    <div id="review"></div>
  </section>
  <aside class="side">
    <section class="sect grow">
      <span class="label">Chat</span>
      <div class="chat" id="chat"></div>
    </section>
    <section class="sect drafts" id="drafts" hidden>
      <span class="label" id="drafts-label"></span>
      <div id="draft-rows"></div>
    </section>
    <form class="sect" id="composer">
      <textarea id="text" aria-label="Message" placeholder="Add a message" rows="3"></textarea>
      <div class="actions">
        <button type="submit" class="btn primary" id="send">Send to agent</button>
        <button type="button" class="btn" id="end">Send and end</button>
      </div>
    </form>
  </aside>
</main>
</body>
</html>
