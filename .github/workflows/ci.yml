name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate skills and metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Validate repository
        run: python scripts/validate_repo.py
      - name: Test repository validator
        run: python -B -m unittest discover -s tests -p 'test_validate_repo.py' -v

  tests:
    name: Setup tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/setup.sh && sh -n scripts/setup.sh
      - name: Check whitespace
        run: git diff-tree --check --no-commit-id -r HEAD
      - name: Install ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck
      - name: Run ShellCheck (Linux)
        if: runner.os == 'Linux'
        run: shellcheck scripts/setup.sh

  windows:
    name: Native Windows junction tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Run native junction tests
        run: python -B -m unittest discover -s tests -p 'test_windows_setup.py' -v

  mockup:
    name: Mockup app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: skills/mockup/app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: skills/mockup/app/package-lock.json
      # The CLI installs and builds the app on first start; doing it here keeps
      # the parallel test files from reinstalling under each other.
      - name: Install and build the app
        run: |
          node bin/mockup.mjs start --design ci --repo "$RUNNER_TEMP/mockup-ci" --no-open --harness claude
          node bin/mockup.mjs stop --dir "$RUNNER_TEMP/mockup-ci/.design/ci"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run tests
        run: npm test
